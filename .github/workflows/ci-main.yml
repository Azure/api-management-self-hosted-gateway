name: Helm Chart CI (Main)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}

jobs:
  deploy-gateway-token:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enableHighAvailability: [false, true]
        kubernetesVersion: [v1.36, v1.35, v1.34, v1.33]
        include:
          # Images are defined on every Kind release
          # See https://github.com/kubernetes-sigs/kind/releases for an overview of the images
        - kubernetesVersion: v1.36
          kindImage: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        - kubernetesVersion: v1.35
          kindImage: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
        - kubernetesVersion: v1.34
          kindImage: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
        - kubernetesVersion: v1.33
          kindImage: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    name: Deploy to Kubernetes ${{ matrix.kubernetesVersion }} (${{ (matrix.enableHighAvailability == true && 'With HA') || 'Without HA' }})
    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Authenticate to Azure
      uses: azure/login@v2
      with:
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
        client-id: ${{ env.AZURE_CI_CLIENT_ID }}
        audience: api://AzureADTokenExchange

    - name: Get gateway secrets from Azure Key Vault
      id: fetched-secrets
      shell: bash
      env:
        AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      run: |
        set -euo pipefail
        configuration_url=$(az keyvault secret show --name Gateway-Configuration-Url --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        gateway_token=$(az keyvault secret show --name Gateway-Token --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        echo "::add-mask::$configuration_url"
        echo "::add-mask::$gateway_token"
        if [[ -z "$configuration_url" || -z "$gateway_token" ]]; then
          echo "::error::Gateway-Configuration-Url and Gateway-Token must not be empty."
          exit 1
        fi
        if [[ "$configuration_url" == *$'\n'* || "$configuration_url" == *$'\r'* || "$gateway_token" == *$'\n'* || "$gateway_token" == *$'\r'* ]]; then
          echo "::error::Gateway-Configuration-Url and Gateway-Token must be single-line values."
          exit 1
        fi
        printf 'configurationUrl=%s\ngatewayToken=%s\n' "$configuration_url" "$gateway_token" >> "$GITHUB_OUTPUT"

    - name: Helm install
      uses: Azure/setup-helm@v1
      
    - name: Create k8s ${{ matrix.kubernetesVersion }} Kind Cluster
      uses: helm/kind-action@v1.2.0
      with:
        version: v0.32.0
        node_image: ${{ matrix.kindImage }}
        config: ./testing/kind-cluster.yml

    - name: Show Kubernetes version
      run: |
        kubectl version

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Describe Control-Plane Node
      run: |
        kubectl describe nodes/chart-testing-control-plane

    - name: Describe Worker Node
      run: |
        kubectl describe nodes/chart-testing-worker

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Show Helm version
      run: |
        helm version

    - name: Create Kubernetes namespace
      run: kubectl create ns apim-gateway

    - name: Template Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        GATEWAY_TOKEN: ${{ steps.fetched-secrets.outputs.gatewayToken }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set-string gateway.auth.key="$GATEWAY_TOKEN" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --dry-run

    - name: Install Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        GATEWAY_TOKEN: ${{ steps.fetched-secrets.outputs.gatewayToken }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set-string gateway.auth.key="$GATEWAY_TOKEN" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --wait --timeout 10m0s

    - name: Show Kubernetes resources
      run: kubectl get all --namespace apim-gateway
      if: always()

    - name: Show Logs for Self-Hosted Gateway
      run: kubectl logs -l app.kubernetes.io/name=azure-api-management-gateway --namespace apim-gateway --tail=100
      if: always()

  deploy-azure-ad:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        enableHighAvailability: [false, true]
        kubernetesVersion: [v1.36, v1.35, v1.34, v1.33]
        include:
          # Images are defined on every Kind release
          # See https://github.com/kubernetes-sigs/kind/releases for an overview of the images
        - kubernetesVersion: v1.36
          kindImage: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        - kubernetesVersion: v1.35
          kindImage: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
        - kubernetesVersion: v1.34
          kindImage: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
        - kubernetesVersion: v1.33
          kindImage: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    name: Deploy to Kubernetes ${{ matrix.kubernetesVersion }} (${{ (matrix.enableHighAvailability == true && 'With HA') || 'Without HA' }})
    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Authenticate to Azure
      uses: azure/login@v2
      with:
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
        client-id: ${{ env.AZURE_CI_CLIENT_ID }}
        audience: api://AzureADTokenExchange

    - name: Get gateway secrets from Azure Key Vault
      id: fetched-secrets
      shell: bash
      env:
        AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      run: |
        set -euo pipefail
        configuration_url=$(az keyvault secret show --name Gateway-Configuration-Url --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        app_secret=$(az keyvault secret show --name Azure-Ad-App-Secret --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        echo "::add-mask::$configuration_url"
        echo "::add-mask::$app_secret"
        if [[ -z "$configuration_url" || -z "$app_secret" ]]; then
          echo "::error::Gateway-Configuration-Url and Azure-Ad-App-Secret must not be empty."
          exit 1
        fi
        if [[ "$configuration_url" == *$'\n'* || "$configuration_url" == *$'\r'* || "$app_secret" == *$'\n'* || "$app_secret" == *$'\r'* ]]; then
          echo "::error::Gateway-Configuration-Url and Azure-Ad-App-Secret must be single-line values."
          exit 1
        fi
        printf 'configurationUrl=%s\nadAppSecret=%s\n' "$configuration_url" "$app_secret" >> "$GITHUB_OUTPUT"

    - name: Helm install
      uses: Azure/setup-helm@v1
      
    - name: Create k8s ${{ matrix.kubernetesVersion }} Kind Cluster
      uses: helm/kind-action@v1.2.0
      with:
        version: v0.32.0
        node_image: ${{ matrix.kindImage }}
        config: ./testing/kind-cluster.yml

    - name: Show Kubernetes version
      run: |
        kubectl version

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Describe Control-Plane Node
      run: |
        kubectl describe nodes/chart-testing-control-plane

    - name: Describe Worker Node
      run: |
        kubectl describe nodes/chart-testing-worker

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Show Helm version
      run: |
        helm version

    - name: Create Kubernetes namespace
      run: kubectl create ns apim-gateway

    - name: Template Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        AD_APP_SECRET: ${{ steps.fetched-secrets.outputs.adAppSecret }}
        GATEWAY_NAME: ${{ vars.GATEWAY_NAME }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set gateway.auth.type=AzureAdApp --set-string gateway.name="$GATEWAY_NAME" --set-string gateway.auth.azureAd.tenant.id="$AZURE_TENANT_ID" --set-string gateway.auth.azureAd.app.id="$AZURE_CI_CLIENT_ID" --set-string gateway.auth.azureAd.app.secret="$AD_APP_SECRET" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --dry-run

    - name: Install Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        AD_APP_SECRET: ${{ steps.fetched-secrets.outputs.adAppSecret }}
        GATEWAY_NAME: ${{ vars.GATEWAY_NAME }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set gateway.auth.type=AzureAdApp --set-string gateway.name="$GATEWAY_NAME" --set-string gateway.auth.azureAd.tenant.id="$AZURE_TENANT_ID" --set-string gateway.auth.azureAd.app.id="$AZURE_CI_CLIENT_ID" --set-string gateway.auth.azureAd.app.secret="$AD_APP_SECRET" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --wait --timeout 10m0s

    - name: Show Kubernetes resources
      run: kubectl get all --namespace apim-gateway
      if: always()

    - name: Show Logs for Self-Hosted Gateway
      run: kubectl logs -l app.kubernetes.io/name=azure-api-management-gateway --namespace apim-gateway --tail=100
      if: always()
