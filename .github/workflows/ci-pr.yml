name: Helm Chart CI (PR)
on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_DOCS_VERSION: "1.14.2"
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_CI_CLIENT_ID: ${{ secrets.AZURE_CI_CLIENT_ID }}
  USE_AZURE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

jobs:
  validate-helm-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        fetch-depth: 0

    - name: Install helm-docs
      run: |
        curl -fsSL https://github.com/norwoodj/helm-docs/releases/download/v${{ env.HELM_DOCS_VERSION }}/helm-docs_${{ env.HELM_DOCS_VERSION }}_Linux_x86_64.tar.gz -o helm-docs.tar.gz
        tar -xzf helm-docs.tar.gz
        chmod +x helm-docs
        sudo mv helm-docs /usr/local/bin/
        helm-docs --version

    - name: Run helm-docs
      run: |
        cd helm-charts/azure-api-management-gateway
        helm-docs

    - name: Check if README is up-to-date
      run: |
        if git diff --exit-code helm-charts/azure-api-management-gateway/README.md; then
          echo "✅ README.md is up-to-date"
        else
          echo "❌ README.md is out of date. Please run 'helm-docs' in the helm-charts/azure-api-management-gateway directory and commit the changes."
          git diff helm-charts/azure-api-management-gateway/README.md
          exit 1
        fi

  lint-helm:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        fetch-depth: 0

    - name: Helm install
      uses: Azure/setup-helm@18bc76811624f360dbd7f18c2d4ecb32c7b87bab # v1.1

    - name: Lint 'azure-api-management-gateway' Helm chart (Gateway Token)
      # We are using dummy gateway parameters here just to show how you can pass them as they are required
      run: helm lint helm-charts/azure-api-management-gateway --set gateway.configuration.uri="xyz.configuration.azure-api.net" --set gateway.auth.key="GatewayKey xyz"

    - name: Lint 'azure-api-management-gateway' Helm chart (Azure AD App)
      # We are using dummy gateway parameters here just to show how you can pass them as they are required
      run: helm lint helm-charts/azure-api-management-gateway --set gateway.configuration.uri="xyz.configuration.azure-api.net" --set gateway.auth.type="AzureAdApp" --set gateway.name=gateway-name --set gateway.auth.azureAd.tenant.id=ci-tenant-id --set gateway.auth.azureAd.app.id=ci-app-id --set gateway.auth.azureAd.app.secret=xyz
  
  deploy-helm:
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: [lint-helm, validate-helm-docs]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        enableHighAvailability: [false, true]
        kubernetesVersion: [v1.36, v1.35, v1.34, v1.33]
        include:
          # Images are defined on every Kind release
          # See https://github.com/kubernetes-sigs/kind/releases for an overview of the images
        - kubernetesVersion: v1.36
          kindImage: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
        - kubernetesVersion: v1.35
          kindImage: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
        - kubernetesVersion: v1.34
          kindImage: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
        - kubernetesVersion: v1.33
          kindImage: kindest/node:v1.33.12@sha256:3f5c8443c620245e4d355cfe09e96a91ead32ceaa569d3f1ca9edf0cb2fe2ff4
    name: Deploy to Kubernetes ${{ matrix.kubernetesVersion }} on ${{ matrix.architecture }} (${{ (matrix.enableHighAvailability == true && 'With HA') || 'Without HA' }})
    steps:
    - name: Check out code
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        fetch-depth: 0

    - name: Authenticate to Azure
      if: env.USE_AZURE == 'true'
      uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
      with:
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
        client-id: ${{ env.AZURE_CI_CLIENT_ID }}
        audience: api://AzureADTokenExchange

    - name: Get gateway configuration
      id: fetched-secrets
      shell: bash
      env:
        AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
      run: |
        set -euo pipefail
        if [[ "$USE_AZURE" != "true" ]]; then
          echo "Running credential-free chart tests for this event."
          printf 'configurationUrl=xyz.configuration.azure-api.net\ngatewayToken=xyz\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        configuration_url=$(az keyvault secret show --name Gateway-Configuration-Url --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        gateway_token=$(az keyvault secret show --name Gateway-Token --vault-name "$AZURE_KEY_VAULT_NAME" --query value --output tsv)
        echo "::add-mask::$configuration_url"
        echo "::add-mask::$gateway_token"
        if [[ -z "$configuration_url" || -z "$gateway_token" ]]; then
          echo "::error::Gateway-Configuration-Url and Gateway-Token must not be empty."
          exit 1
        fi
        if [[ "$configuration_url" == *$'\n'* || "$configuration_url" == *$'\r'* || "$gateway_token" == *$'\n'* || "$gateway_token" == *$'\r'* ]]; then
          echo "::error::Gateway-Configuration-Url and Gateway-Token must be single-line values."
          exit 1
        fi
        printf 'configurationUrl=%s\ngatewayToken=%s\n' "$configuration_url" "$gateway_token" >> "$GITHUB_OUTPUT"

    - name: Helm install
      uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      
    - name: Create k8s ${{ matrix.kubernetesVersion }} Kind Cluster
      uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      with:
        version: v0.32.0
        kubectl_version: ${{ matrix.kubernetesVersion }}.0
        node_image: ${{ matrix.kindImage }}
        config: ./testing/kind-cluster.yml

    - name: Show Kubernetes version
      run: |
        kubectl version

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Describe Control-Plane Node
      run: |
        kubectl describe nodes/chart-testing-control-plane

    - name: Describe Worker Node
      run: |
        kubectl describe nodes/chart-testing-worker

    - name: Show Kubernetes nodes
      run: |
        kubectl get nodes -o wide

    - name: Show Helm version
      run: |
        helm version

    - name: Create Kubernetes namespace
      run: kubectl create ns apim-gateway

    - name: Template Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        GATEWAY_TOKEN: ${{ steps.fetched-secrets.outputs.gatewayToken }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set-string gateway.auth.key="$GATEWAY_TOKEN" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --dry-run

    - name: Install Helm chart
      env:
        GATEWAY_CONFIG_URL: ${{ steps.fetched-secrets.outputs.configurationUrl }}
        GATEWAY_TOKEN: ${{ steps.fetched-secrets.outputs.gatewayToken }}
      run: helm install azure-api-management-gateway ./helm-charts/azure-api-management-gateway --namespace apim-gateway --set-string gateway.configuration.uri="$GATEWAY_CONFIG_URL" --set-string gateway.auth.key="$GATEWAY_TOKEN" --set highAvailability.enabled=${{ matrix.enableHighAvailability }} --set gateway.deployment.strategy.type=Recreate --values ./testing/test-config.yml --wait --timeout 10m0s

    - name: Show Kubernetes resources
      run: kubectl get all --namespace apim-gateway
      if: always()

    - name: Show Logs for Self-Hosted Gateway
      run: kubectl logs -l app.kubernetes.io/name=azure-api-management-gateway --namespace apim-gateway --tail=100
      if: always()
